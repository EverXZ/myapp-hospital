<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Hospital System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="src/css/glass.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Crear Cuenta</h1>
            <p class="text-blue-200">Únete a nuestro sistema</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-blue-100 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" class="glass-input w-full p-3 rounded-lg" placeholder="Juan Pérez" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-blue-100 mb-1">DNI</label>
                <input type="text" id="dni" class="glass-input w-full p-3 rounded-lg" placeholder="12345678" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-blue-100 mb-1">Email</label>
                <input type="email" id="email" class="glass-input w-full p-3 rounded-lg" placeholder="juan@example.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-blue-100 mb-1">Contraseña</label>
                <input type="password" id="password" class="glass-input w-full p-3 rounded-lg" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="glass-button w-full py-3 rounded-lg shadow-lg transform hover:scale-[1.02] transition-all mt-6">
                Registrarse
            </button>
        </form>

        <p class="text-center text-blue-200 mt-6 text-sm">
            ¿Ya tienes cuenta? <a href="login.html" class="text-white font-bold hover:underline">Inicia Sesión</a>
        </p>
    </div>

    <script src="src/js/register.js"></script>
</body>
</html>
