<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Facturación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="dashboard_admin.html" class="text-gray-300 hover:text-white">← Volver</a>
            <h1 class="text-xl font-bold">Facturación</h1>
        </div>
    </nav>

    <div class="container mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Pendientes -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Pendiente de Cobro</h2>
            <div id="pendientesList" class="space-y-3">
                <p class="text-gray-500">Cargando...</p>
            </div>
        </div>

        <!-- Historial -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Historial de Facturas</h2>
            <div id="historialList" class="space-y-3 max-h-96 overflow-y-auto">
                <p class="text-gray-500">Cargando...</p>
            </div>
        </div>

    </div>

    <script src="src/js/admin_facturacion.js"> </script>

</html>
