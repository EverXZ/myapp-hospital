<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Facturación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="src/css/glass.css" rel="stylesheet">
</head>
<body class="p-6">

    <nav class="glass-panel p-4 rounded-xl flex justify-between items-center mb-6">
        <div class="flex items-center gap-4">
            <a href="dashboard_admin.html" class="text-blue-200 hover:text-white transition">← Volver</a>
            <h1 class="text-xl font-bold text-white">Facturación</h1>
        </div>
    </nav>

    <div class="container mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Pendientes -->
        <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-lg font-bold text-white mb-4 border-b border-white/10 pb-2">Cobros Pendientes</h2>
            <div id="pendientesList" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                <p class="text-blue-200">Cargando...</p>
            </div>
        </div>

        <!-- Historial -->
        <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-lg font-bold text-white mb-4 border-b border-white/10 pb-2">Historial de Facturas</h2>
            <div id="historialList" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                <p class="text-blue-200">Cargando...</p>
            </div>
        </div>

    </div>

    <script src="src/js/admin_facturacion.js"></script>
</body>
</html>
