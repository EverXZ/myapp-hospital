<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes</title>
    <!-- Tailwind CSS (CDN para desarrollo rápido) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">🏥 Pacientes</h1>
            <a href="index.html" class="text-blue-600 hover:underline">Volver al Inicio</a>
        </div>

        <!-- Formulario de Registro -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Registrar Nuevo Paciente</h2>
            <form id="formPaciente" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="nombre" placeholder="Nombre Completo" class="border p-2 rounded" required>
                <input type="text" id="dni" placeholder="DNI / Cédula" class="border p-2 rounded" required>
                <input type="date" id="fecha_nacimiento" class="border p-2 rounded" required>
                <input type="tel" id="telefono" placeholder="Teléfono" class="border p-2 rounded">
                <input type="email" id="email" placeholder="Correo Electrónico" class="border p-2 rounded md:col-span-2">
                
                <button type="submit" class="bg-blue-600 text-white p-2 rounded md:col-span-2 hover:bg-blue-700 transition">
                    Guardar Paciente
                </button>
            </form>
        </div>

        <!-- Tabla de Resultados -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-3">ID</th>
                        <th class="p-3">Nombre</th>
                        <th class="p-3">DNI</th>
                        <th class="p-3">Teléfono</th>
                        <th class="p-3">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaPacientes" class="text-gray-700">
                    <!-- Aquí se insertarán los datos con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Lógica Javascript -->
    <script src="src/js/pacientes.js"></script>
</body>
</html>
