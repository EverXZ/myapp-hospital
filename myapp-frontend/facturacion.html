<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja y Facturación</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">💰 Caja y Facturación</h1>
            <a href="../index.html" class="text-blue-600 hover:underline">&larr; Volver</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Columna 1: Pendientes (Izquierda) -->
            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md h-fit">
                <h2 class="text-xl font-bold text-red-600 mb-4 border-b pb-2">1. Pendientes de Cobro</h2>
                <div id="listaPendientes" class="space-y-3 max-h-96 overflow-y-auto">
                    <p class="text-gray-400 text-sm">Cargando...</p>
                </div>
            </div>

            <!-- Columna 2: Recibo Actual (Centro) -->
            <div id="reciboContainer" class="hidden lg:col-span-1 bg-yellow-50 p-6 rounded-lg shadow-lg border-2 border-yellow-200 h-fit">
                <div class="text-center mb-4">
                    <h3 class="text-2xl font-bold text-yellow-800">FACTURA</h3>
                    <p class="text-sm text-yellow-600">Hospital Central</p>
                </div>
                
                <div class="space-y-2 text-sm text-gray-700 mb-6">
                    <p><strong>Factura #:</strong> <span id="reciboId">---</span></p>
                    <p><strong>Fecha:</strong> <span id="reciboFecha">---</span></p>
                </div>

                <div class="border-t border-b border-yellow-200 py-4 mb-4">
                    <p class="flex justify-between font-bold text-lg">
                        <span>TOTAL A PAGAR:</span>
                        <span id="reciboTotal" class="text-green-600">$0.00</span>
                    </p>
                </div>

                <button onclick="window.print()" class="w-full bg-yellow-600 text-white p-2 rounded hover:bg-yellow-700 font-bold mb-2">
                    Imprimir
                </button>
                <button onclick="limpiarRecibo()" class="w-full bg-gray-200 text-gray-700 p-2 rounded hover:bg-gray-300 text-sm">
                    Cerrar
                </button>
            </div>

            <!-- Columna 3: Historial (Derecha - Nueva) -->
            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md h-fit">
                <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">📜 Historial de Facturas</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="p-2">ID</th>
                                <th class="p-2">Paciente</th>
                                <th class="p-2 text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistorial" class="text-gray-600">
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/js/facturacion.js">
        
    </script>
</body>
</html>
