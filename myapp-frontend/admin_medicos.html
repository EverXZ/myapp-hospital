<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Médicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="src/css/glass.css" rel="stylesheet">
</head>
<body class="p-6">

    <nav class="glass-panel p-4 rounded-xl flex justify-between items-center mb-6">
        <div class="flex items-center gap-4">
            <a href="dashboard_admin.html" class="text-blue-200 hover:text-white transition">← Volver</a>
            <h1 class="text-xl font-bold text-white">Gestión de Médicos</h1>
        </div>
    </nav>

    <div class="container mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Formulario Crear -->
        <div class="lg:col-span-1">
            <div class="glass-panel p-6 rounded-2xl">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-white/10 pb-2">Registrar Médico</h2>
                <form id="createDoctorForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-blue-100">Nombre Completo</label>
                        <input type="text" id="nombre" class="glass-input w-full p-2 rounded mt-1" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-blue-100">Especialidad</label>
                        <input type="text" id="especialidad" class="glass-input w-full p-2 rounded mt-1" placeholder="Ej: Cardiología" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-blue-100">Email</label>
                        <input type="email" id="email" class="glass-input w-full p-2 rounded mt-1" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-blue-100">Contraseña</label>
                        <input type="password" id="password" class="glass-input w-full p-2 rounded mt-1" required>
                    </div>
                    <button type="submit" class="glass-button w-full py-2 rounded hover:shadow-lg">Registrar</button>
                </form>
            </div>
        </div>

        <!-- Lista Médicos -->
        <div class="lg:col-span-2">
            <div class="glass-panel p-6 rounded-2xl">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-white/10 pb-2">Lista de Médicos</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-blue-100">
                        <thead class="text-xs uppercase bg-white/10 text-white">
                            <tr>
                                <th class="px-4 py-3 rounded-tl-lg">ID</th>
                                <th class="px-4 py-3">Nombre</th>
                                <th class="px-4 py-3">Especialidad</th>
                                <th class="px-4 py-3 rounded-tr-lg">Email</th>
                            </tr>
                        </thead>
                        <tbody id="doctorsList"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="src/js/admin_medicos.js"></script>
</body>
</html>
