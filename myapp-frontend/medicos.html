<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Médicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">👨‍⚕️ Médicos</h1>
            <a href="index.html" class="text-blue-600 hover:underline flex items-center gap-1">
                <span>&larr;</span> Volver al Inicio
            </a>
        </div>

        <!-- Formulario de Registro -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Registrar Nuevo Especialista</h2>
            <form id="formMedico" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="nombre" placeholder="Nombre Completo" class="border p-2 rounded" required>
                
                <!-- Select de Especialidades -->
                <select id="especialidad" class="border p-2 rounded bg-white" required>
                    <option value="" disabled selected>Seleccione Especialidad</option>
                    <option value="Medicina General">Medicina General</option>
                    <option value="Cardiología">Cardiología</option>
                    <option value="Pediatría">Pediatría</option>
                    <option value="Dermatología">Dermatología</option>
                    <option value="Cirugía">Cirugía</option>
                </select>

                <input type="text" id="licencia" placeholder="Número de Licencia / Colegiado" class="border p-2 rounded" required>
                <input type="tel" id="telefono" placeholder="Teléfono de Contacto" class="border p-2 rounded">
                <input type="email" id="email" placeholder="Correo Electrónico" class="border p-2 rounded md:col-span-2">
                
                <button type="submit" class="bg-indigo-600 text-white p-2 rounded md:col-span-2 hover:bg-indigo-700 transition font-medium">
                    Guardar Médico
                </button>
            </form>
        </div>

        <!-- Tabla de Resultados, la logica, al ser algo "flexible" se hace desde el script de javascript-->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-200 text-gray-700">
                    <tr>
                        <th class="p-3">ID</th>
                        <th class="p-3">Médico</th>
                        <th class="p-3">Especialidad</th>
                        <th class="p-3">Licencia</th>
                        <th class="p-3">Teléfono</th>
                    </tr>
                </thead>
                <tbody id="tablaMedicos" class="text-gray-600">
                </tbody>
            </table>
        </div>
    </div>
    <script type="module" src="src/js/medicos.js"> </script>
</body>
</html>
