<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Salud - Paciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="src/css/glass.css" rel="stylesheet">
</head>
<body class="p-6">

    <nav class="glass-panel p-4 rounded-xl flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-white">Mi Portal de Salud</h1>
        <div class="flex items-center gap-4">
            <span id="patientName" class="text-blue-200 font-medium">Hola, ...</span>
            <button onclick="logout()" class="glass-button px-4 py-2 rounded-lg text-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- Historial de Tratamientos -->
        <div class="glass-panel p-6 rounded-2xl">
            <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                <div class="p-2 bg-blue-500/20 rounded-lg">
                    <svg class="w-6 h-6 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-white">Mis Tratamientos</h2>
            </div>
            <div id="tratamientosList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                <p class="text-blue-200">Cargando...</p>
            </div>
        </div>

        <!-- Próximas Citas -->
        <div class="glass-panel p-6 rounded-2xl">
            <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                <div class="p-2 bg-purple-500/20 rounded-lg">
                    <svg class="w-6 h-6 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-white">Próximas Citas</h2>
            </div>
            <div id="citasList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                <p class="text-blue-200">Cargando...</p>
            </div>
        </div>

    </div>

    <script src="src/js/dashboard_paciente.js"></script>
</body>
</html>
