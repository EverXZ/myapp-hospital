<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portal - Paciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Portal del Paciente</h1>
        <div class="flex items-center gap-4">
            <span id="userName" class="font-medium">Usuario</span>
            <button onclick="logout()" class="bg-white text-blue-600 px-3 py-1 rounded hover:bg-gray-100 text-sm">Salir</button>
        </div>
    </nav>

    <div class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Columna Tratamientos -->
        <div class="space-y-6">
            <!-- Tratamientos Activos -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-green-700 mb-4 border-b pb-2">Tratamientos Activos</h2>
                <div id="tratamientosActivosList" class="space-y-4">
                    <p class="text-gray-500 text-sm">Cargando...</p>
                </div>
            </div>

            <!-- Historial Tratamientos -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-gray-600 mb-4 border-b pb-2">Historial de Tratamientos</h2>
                <div id="tratamientosHistorialList" class="space-y-4">
                    <p class="text-gray-500 text-sm">Cargando...</p>
                </div>
            </div>
        </div>

        <!-- Columna Citas -->
        <div class="space-y-6">
            <!-- Próximas Citas -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-blue-700 mb-4 border-b pb-2">Próximas Citas</h2>
                <div id="citasFuturasList" class="space-y-4">
                    <p class="text-gray-500 text-sm">Cargando...</p>
                </div>
            </div>

            <!-- Historial Citas -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-gray-600 mb-4 border-b pb-2">Historial de Citas</h2>
                <div id="citasHistorialList" class="space-y-4">
                    <p class="text-gray-500 text-sm">Cargando...</p>
                </div>
            </div>
        </div>

    </div>

    <script src="src/js/dashboard_paciente.js"></script>

</body>
</html>
