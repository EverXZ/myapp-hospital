<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="src/css/glass.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Bienvenido</h1>
            <p class="text-blue-200">Ingresa a tu cuenta</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-blue-100 mb-2">Usuario</label>
                <input type="text" id="username" class="glass-input w-full p-3 rounded-lg" placeholder="Tu usuario" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-blue-100 mb-2">Contraseña</label>
                <input type="password" id="password" class="glass-input w-full p-3 rounded-lg" placeholder="••••••••" required>
            </div>
            <button type="submit" class="glass-button w-full py-3 rounded-lg shadow-lg transform hover:scale-[1.02] transition-all">
                Iniciar Sesión
            </button>
        </form>

        <p class="text-center text-blue-200 mt-6 text-sm">
            ¿No tienes cuenta? <a href="register.html" class="text-white font-bold hover:underline">Regístrate aquí</a>
        </p>
    </div>

    <script src="src/js/login.js"></script>
</body>
</html>
