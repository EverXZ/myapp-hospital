<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia e Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">💊 Farmacia e Inventario</h1>
            <a href="index.html" class="text-blue-600 hover:underline flex items-center gap-1">
                <span>&larr;</span> Volver al Inicio
            </a>
        </div>

        <!-- Sección Superior: Formulario de Ingreso -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8 border-l-4 border-green-500">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Ingresar Nuevo Medicamento</h2>
            <form id="formMedicamento" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase">Nombre Comercial</label>
                    <input type="text" id="nombre" placeholder="Ej: Paracetamol 500mg" class="w-full border p-2 rounded focus:ring-2 focus:ring-green-200 outline-none" required>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Principio Activo</label>
                    <input type="text" id="principio" placeholder="Ej: Acetaminofén" class="w-full border p-2 rounded focus:ring-2 focus:ring-green-200 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Stock Inicial</label>
                    <input type="number" id="stock" placeholder="0" class="w-full border p-2 rounded focus:ring-2 focus:ring-green-200 outline-none" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Precio ($)</label>
                    <input type="number" step="0.01" id="precio" placeholder="0.00" class="w-full border p-2 rounded focus:ring-2 focus:ring-green-200 outline-none" required>
                </div>
                
                <div class="md:col-span-3"></div> <!-- Espaciador -->

                <button type="submit" class="bg-green-600 text-white p-2 rounded hover:bg-green-700 transition font-bold shadow-sm w-full">
                    + Guardar
                </button>
            </form>
        </div>

        <!-- Tabla de Inventario -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-bold text-gray-700">Inventario Actual</h3>
                <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full">Actualizado en tiempo real</span>
            </div>
            <table class="w-full text-left border-collapse">
                <thead class="bg-green-50 text-green-800 text-xs uppercase">
                    <tr>
                        <th class="p-4">ID</th>
                        <th class="p-4">Medicamento</th>
                        <th class="p-4">Principio Activo</th>
                        <th class="p-4 text-center">Stock</th>
                        <th class="p-4 text-right">Precio Unit.</th>
                        <th class="p-4 text-center">Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaMedicamentos" class="text-gray-600 text-sm">
                    <!-- JS llenará esto -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Lógica Javascript -->
    <script type="module" src="src/js/farmacia.js"> </script>
</body>
</html>
