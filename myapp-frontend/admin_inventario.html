    <div id="restockModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h3 class="text-xl font-bold mb-4">Actualizar Stock</h3>
            <p id="modalItemName" class="text-gray-600 mb-4">Producto...</p>
            
            <input type="hidden" id="modalType">
            <input type="hidden" id="modalId">
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Cantidad a agregar</label>
                <input type="number" id="modalQty" class="w-full p-2 border rounded" min="1" value="1">
            </div>

            <div class="flex justify-end gap-2">
                <button onclick="closeRestockModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
                <button onclick="confirmRestock()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Guardar</button>
            </div>
        </div>
    </div>
    <script src="src/js/admin_inventario.js"> </script>
</body>
