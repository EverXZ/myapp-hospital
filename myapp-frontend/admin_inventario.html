<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="dashboard_admin.html" class="text-gray-300 hover:text-white">← Volver</a>
            <h1 class="text-xl font-bold">Inventario</h1>
        </div>
    </nav>

    <div class="container mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Medicamentos -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Medicamentos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th class="px-4 py-2">Nombre</th>
                            <th class="px-4 py-2">Stock</th>
                            <th class="px-4 py-2">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="medsList"></tbody>
                </table>
            </div>
        </div>

        <!-- Equipos -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Equipos Médicos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th class="px-4 py-2">Nombre</th>
                            <th class="px-4 py-2">Estado</th>
                            <th class="px-4 py-2">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="equiposList"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal Re-stock -->
    <div id="restockModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h3 class="text-xl font-bold mb-4">Actualizar Stock</h3>
            <p id="modalItemName" class="text-gray-600 mb-4">Producto...</p>
            
            <input type="hidden" id="modalType">
            <input type="hidden" id="modalId">
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Cantidad a agregar</label>
                <input type="number" id="modalQty" class="w-full p-2 border rounded" min="1" value="1">
            </div>

            <div class="flex justify-end gap-2">
                <button onclick="closeRestockModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
                <button onclick="confirmRestock()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Guardar</button>
            </div>
        </div>
    </div>
    <script src="src/js/admin_inventario.js"> </script>
</body>
</html>
