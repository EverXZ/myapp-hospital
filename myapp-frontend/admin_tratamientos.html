<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tratamientos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="src/css/glass.css" rel="stylesheet">
</head>
<body class="p-6">

    <nav class="glass-panel p-4 rounded-xl flex justify-between items-center mb-6">
        <div class="flex items-center gap-4">
            <a href="dashboard_admin.html" class="text-blue-200 hover:text-white transition">← Volver</a>
            <h1 class="text-xl font-bold text-white">Gestión de Tratamientos</h1>
        </div>
    </nav>

    <div class="container mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Crear Tratamiento -->
        <div class="lg:col-span-1">
            <div class="glass-panel p-6 rounded-2xl">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-white/10 pb-2">Nuevo Tratamiento</h2>
                <form id="createTratamientoForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-blue-100">Paciente</label>
                        <select id="pacienteSelect" class="glass-input w-full p-2 rounded" required>
                            <option value="" class="text-black">Cargando...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-blue-100">Médico</label>
                        <select id="medicoSelect" class="glass-input w-full p-2 rounded" required>
                            <option value="" class="text-black">Cargando...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-blue-100">Nombre del Tratamiento</label>
                        <input type="text" id="nombreTrat" class="glass-input w-full p-2 rounded" placeholder="Ej: Fisioterapia" required>
                    </div>
                    <button type="submit" class="glass-button w-full py-2 rounded hover:shadow-lg">Iniciar Tratamiento</button>
                </form>
            </div>
        </div>

        <!-- Lista Tratamientos -->
        <div class="lg:col-span-2">
            <div class="glass-panel p-6 rounded-2xl">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-white/10 pb-2">Tratamientos en Curso</h2>
                <div id="tratamientosList" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                    <p class="text-blue-200">Cargando...</p>
                </div>
            </div>
        </div>

    </div>

    <script src="src/js/admin_tratamientos.js"></script>
</body>
</html>
