<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta Médica</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <div class="max-w-5xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">🩺 Atender Consulta</h1>
        <a
          href="../index.html"
          class="text-blue-600 hover:underline flex items-center gap-1"
        >
          <span>&larr;</span> Volver
        </a>
      </div>

      <div class="bg-white p-6 rounded-lg shadow-xl border-t-4 border-red-500">
        <form id="formConsulta" class="space-y-8">
          <!-- Sección 1: Paciente -->
          <div class="bg-red-50 p-4 rounded-lg border border-red-100">
            <label class="block text-sm font-bold text-red-800 mb-2"
              >1. Seleccionar Paciente en Espera</label
            >
            <select
              id="selectCita"
              class="w-full border p-3 rounded bg-white font-medium outline-none focus:ring-2 focus:ring-red-200"
              required
            >
              <option value="">Cargando agenda...</option>
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Sección 2: Datos Médicos -->
            <div>
              <label
                class="block text-lg font-bold text-gray-700 mb-2 border-b pb-1"
                >2. Diagnóstico</label
              >
              <input
                type="text"
                id="diagnostico"
                placeholder="Ej: Rinofaringitis Aguda"
                class="w-full border p-3 rounded mb-3 outline-none focus:ring-2 focus:ring-red-200"
                required
              />
              <textarea
                id="observaciones"
                placeholder="Síntomas y observaciones..."
                class="w-full border p-3 rounded h-32 outline-none focus:ring-2 focus:ring-red-200"
              ></textarea>

              <label
                class="block text-lg font-bold text-gray-700 mt-6 mb-2 border-b pb-1"
                >3. Procedimientos Realizados</label
              >
              <div
                id="listaTratamientos"
                class="bg-gray-50 p-3 rounded border h-48 overflow-y-auto space-y-2"
              >
                <!-- Checkboxes se llenan con JS -->
              </div>
            </div>

            <!-- Sección 3: Receta Médica (NUEVO) -->
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
              <label
                class="block text-lg font-bold text-blue-800 mb-2 border-b border-blue-200 pb-1"
                >4. Receta Médica</label
              >

              <!-- Controles para agregar medicina -->
              <div class="grid grid-cols-2 gap-2 mb-2">
                <select
                  id="selectMedicamento"
                  class="col-span-2 border p-2 rounded text-sm"
                >
                  <option value="">Seleccionar Medicamento...</option>
                </select>
                <input
                  type="number"
                  id="cantMed"
                  placeholder="Cant."
                  class="border p-2 rounded text-sm"
                  min="1"
                  value="1"
                />
                <input
                  type="text"
                  id="dosisMed"
                  placeholder="Dosis (Ej: 1 c/8h)"
                  class="border p-2 rounded text-sm"
                />
              </div>
              <button
                type="button"
                onclick="agregarMedicamento()"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 text-sm font-bold mb-4"
              >
                + Agregar a la Receta
              </button>

              <!-- Lista visual de lo recetado -->
              <div class="bg-white rounded border h-64 overflow-y-auto">
                <table class="w-full text-sm text-left">
                  <thead class="bg-gray-100 text-gray-600">
                    <tr>
                      <th class="p-2">Medicina</th>
                      <th class="p-2">Cant.</th>
                      <th class="p-2">Acción</th>
                    </tr>
                  </thead>
                  <tbody id="tablaReceta" class="text-gray-700">
                    <!-- Aquí aparecen los agregados -->
                  </tbody>
                </table>
                <p
                  id="emptyReceta"
                  class="text-center text-gray-400 text-xs p-4"
                >
                  Sin medicamentos
                </p>
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="w-full bg-green-600 text-white p-4 rounded-lg hover:bg-green-700 transition font-bold text-xl shadow-lg flex justify-center items-center gap-2"
          >
            <span>💾</span> Guardar Consulta y Generar Receta
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="src/js/consulta.js"></script>
  </body>
</html>
