<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="dashboard_admin.html" class="text-gray-300 hover:text-white">← Volver</a>
            <h1 class="text-xl font-bold">Gestión de Servicios</h1>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Órdenes de Laboratorio</h2>
            
            <!-- Simulación de creación de orden (Normalmente lo haría el médico) -->
            <div class="mb-6 p-4 bg-gray-50 rounded border">
                <h3 class="font-semibold text-sm text-gray-700 mb-2">Nueva Orden (Simulación)</h3>
                <form id="labForm" class="flex gap-2">
                    <input type="number" id="idCitaLab" placeholder="ID Cita" class="p-2 border rounded text-sm" required>
                    <input type="text" id="tipoExamen" placeholder="Tipo Examen (ej: Sangre)" class="p-2 border rounded text-sm flex-1" required>
                    <button type="submit" class="bg-purple-600 text-white px-4 py-1 rounded text-sm hover:bg-purple-700">Crear Orden</button>
                </form>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th class="px-4 py-2">ID Orden</th>
                            <th class="px-4 py-2">Examen</th>
                            <th class="px-4 py-2">Estado</th>
                            <th class="px-4 py-2">Resultados</th>
                            <th class="px-4 py-2">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="ordenesList">
                        <!-- Items -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="src/js/laboratorio.js"> </script>

</body>
</html>
