<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Citas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="dashboard_admin.html" class="text-gray-300 hover:text-white">← Volver</a>
            <h1 class="text-xl font-bold">Gestión de Citas</h1>
        </div>
    </nav>

    <div class="container mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Agendar Cita -->
        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Agendar Nueva Cita</h2>
                <form id="createCitaForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Paciente</label>
                        <select id="pacienteSelect" class="w-full p-2 border rounded" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Médico</label>
                        <select id="medicoSelect" class="w-full p-2 border rounded" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fecha y Hora</label>
                        <input type="datetime-local" id="fecha" class="w-full p-2 border rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Servicio (Opcional)</label>
                        <select id="servicioSelect" class="w-full p-2 border rounded">
                            <option value="">Ninguno / Consulta General</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Motivo</label>
                        <textarea id="motivo" rows="2" class="w-full p-2 border rounded" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-yellow-600 text-white py-2 rounded hover:bg-yellow-700">Agendar Cita</button>
                </form>
            </div>
        </div>

        <!-- Calendario / Lista -->
        <div class="lg:col-span-2">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Calendario de Citas</h2>
                <div id="citasList" class="space-y-3 max-h-96 overflow-y-auto">
                    <p class="text-gray-500">Cargando...</p>
                </div>
            </div>
        </div>

    </div>

    <script src="src/js/admin_citas.js"> </script>
</body>
</html>
