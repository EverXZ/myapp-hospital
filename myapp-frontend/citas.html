<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Encabezado -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">📅 Agenda de Citas</h1>
            <a href="index.html" class="text-blue-600 hover:underline flex items-center gap-1">
                <span>&larr;</span> Volver al Inicio
            </a>
        </div>

        <!-- Formulario de Nueva Cita -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8 border-t-4 border-purple-500">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Agendar Nueva Cita</h2>
            <form id="formCita" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Select Paciente -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Paciente</label>
                    <select id="selectPaciente" class="w-full border p-2 rounded bg-gray-50 focus:ring-2 focus:ring-purple-200 outline-none" required>
                        <option value="">Cargando pacientes...</option>
                    </select>
                </div>

                <!-- Select Médico -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Médico Especialista</label>
                    <select id="selectMedico" class="w-full border p-2 rounded bg-gray-50 focus:ring-2 focus:ring-purple-200 outline-none" required>
                        <option value="">Cargando médicos...</option>
                    </select>
                </div>

                <!-- Fecha y Hora -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha y Hora</label>
                    <input type="datetime-local" id="fecha_hora" class="w-full border p-2 rounded focus:ring-2 focus:ring-purple-200 outline-none" required>
                </div>

                <!-- Motivo -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Motivo de Consulta</label>
                    <input type="text" id="motivo" placeholder="Ej: Dolor abdominal..." class="w-full border p-2 rounded focus:ring-2 focus:ring-purple-200 outline-none" required>
                </div>
                
                <button type="submit" class="bg-purple-600 text-white p-3 rounded md:col-span-2 hover:bg-purple-700 transition font-bold shadow-sm">
                    Confirmar Cita
                </button>
            </form>
        </div>

        <!-- Tabla de Citas -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-4 bg-gray-50 border-b">
                <h3 class="font-bold text-gray-700">Próximas Citas</h3>
            </div>
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
                    <tr>
                        <th class="p-4">Fecha</th>
                        <th class="p-4">Paciente</th>
                        <th class="p-4">Médico</th>
                        <th class="p-4">Motivo</th>
                        <th class="p-4">Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaCitas" class="text-gray-600 text-sm">
                    <!-- JS llenará esto -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Lógica Javascript -->
    <script src="src/js/citas.js"> </script>
</body>
</html>
