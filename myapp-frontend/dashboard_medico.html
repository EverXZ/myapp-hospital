<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Médico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="src/css/glass.css" rel="stylesheet">
</head>
<body class="p-6">

    <nav class="glass-panel p-4 rounded-xl flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-white">Panel Médico</h1>
        <div class="flex items-center gap-4">
            <span id="doctorName" class="text-blue-200 font-medium">Dr. ...</span>
            <button onclick="logout()" class="glass-button px-4 py-2 rounded-lg text-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Columna Izquierda: Citas -->
        <div class="lg:col-span-1 space-y-6">
            <div class="glass-panel p-6 rounded-2xl">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-white/10 pb-2">Mis Citas de Hoy</h2>
                <div id="citasList" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                    <p class="text-blue-200 text-sm">Cargando citas...</p>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Consulta Activa -->
        <div class="lg:col-span-2">
            <div id="consultaPanel" class="glass-panel p-6 rounded-2xl hidden">
                <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                    <div>
                        <h2 class="text-xl font-bold text-white">Consulta en Curso</h2>
                        <p id="pacienteNombre" class="text-blue-300">Paciente: ...</p>
                    </div>
                    <button onclick="cerrarConsulta()" class="text-sm text-red-300 hover:text-red-100">Cancelar</button>
                </div>

                <form id="consultaForm" class="space-y-6">
                    <input type="hidden" id="citaId">
                    <input type="hidden" id="pacienteId">

                    <!-- Diagnóstico -->
                    <div>
                        <label class="block text-sm font-medium text-blue-100 mb-2">Diagnóstico / Notas</label>
                        <textarea id="diagnostico" rows="4" class="glass-input w-full p-3 rounded-lg" placeholder="Escriba el diagnóstico aquí..." required></textarea>
                    </div>

                    <!-- Receta -->
                    <div class="bg-black/20 p-4 rounded-xl">
                        <h3 class="text-md font-bold text-white mb-3">Receta Médica</h3>
                        
                        <div class="flex gap-2 mb-3">
                            <select id="medicamentoSelect" class="glass-input flex-1 p-2 rounded">
                                <option value="" class="text-black">Seleccionar Medicamento...</option>
                            </select>
                            <input type="text" id="dosis" placeholder="Dosis (ej: 1 cada 8h)" class="glass-input w-1/3 p-2 rounded">
                            <button type="button" onclick="agregarMedicamento()" class="glass-button px-4 rounded">+</button>
                        </div>

                        <ul id="recetaList" class="space-y-2 mb-0 text-sm text-blue-100">
                            <!-- Items agregados -->
                        </ul>
                    </div>

                    <!-- Acciones -->
                    <div class="flex justify-end gap-4 pt-4">
                        <button type="submit" class="glass-button px-6 py-3 rounded-lg font-bold shadow-lg">Finalizar Consulta</button>
                    </div>
                </form>
            </div>

            <div id="emptyState" class="glass-panel p-12 rounded-2xl text-center flex flex-col items-center justify-center h-full min-h-[400px]">
                <div class="bg-blue-500/20 p-6 rounded-full mb-4">
                    <svg class="w-16 h-16 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">Listo para atender</h3>
                <p class="text-blue-200">Seleccione una cita del panel izquierdo para iniciar la consulta.</p>
            </div>
        </div>

    </div>

    <script src="src/js/dashboard_medico.js"></script>
</body>
</html>
