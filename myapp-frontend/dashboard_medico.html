<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Médico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-teal-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Portal Médico</h1>
        <div class="flex items-center gap-4">
            <span id="userName" class="font-medium">Dr. Usuario</span>
            <button onclick="logout()" class="bg-white text-teal-600 px-3 py-1 rounded hover:bg-gray-100 text-sm">Salir</button>
        </div>
    </nav>

    <div class="container mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Columna 1: Panel Izquierdo (Citas y Pacientes) -->
        <div class="lg:col-span-1 space-y-6">
            <!-- Citas Pendientes -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Citas Pendientes</h2>
                <div id="citasList" class="space-y-3 max-h-96 overflow-y-auto">
                    <p class="text-gray-500 text-sm">Cargando...</p>
                </div>
            </div>

            <!-- Mis Pacientes -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-teal-700 mb-4 border-b pb-2">Mis Pacientes</h2>
                <div id="pacientesList" class="space-y-2 max-h-60 overflow-y-auto">
                    <p class="text-gray-500 text-sm">Cargando...</p>
                </div>
            </div>
        </div>

        <!-- Columna 2: Panel Principal (Gestión y Tratamientos) -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Formulario de Consulta (Oculto por defecto) -->
            <div id="consultaPanel" class="bg-white p-6 rounded-lg shadow-md hidden border-2 border-teal-500">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold text-gray-800">Atender Cita</h2>
                    <button onclick="closeConsulta()" class="text-red-500 text-sm hover:underline">Cancelar</button>
                </div>
                
                <form id="consultaForm" class="space-y-4">
                    <input type="hidden" id="idCitaAtencion">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Diagnóstico</label>
                        <textarea id="diagnostico" rows="3" class="w-full p-2 border rounded focus:ring-2 focus:ring-teal-500" required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Observaciones</label>
                        <textarea id="observaciones" rows="2" class="w-full p-2 border rounded focus:ring-2 focus:ring-teal-500"></textarea>
                    </div>

                    <!-- Receta Simple -->
                    <div class="border-t pt-4">
                        <h3 class="font-semibold text-gray-700 mb-2">Receta Médica</h3>
                        <div class="grid grid-cols-3 gap-2 mb-2">
                            <select id="medicamentoSelect" class="p-2 border rounded text-sm col-span-1">
                                <option value="">Seleccionar Medicamento...</option>
                            </select>
                            <input type="number" id="cantidadMed" placeholder="Cant." class="p-2 border rounded text-sm w-full">
                            <input type="text" id="dosisMed" placeholder="Dosis (ej: 1 cada 8h)" class="p-2 border rounded text-sm w-full">
                        </div>
                        <button type="button" onclick="addMedicamento()" class="text-sm bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">+ Agregar a Receta</button>
                        
                        <ul id="recetaList" class="mt-2 text-sm text-gray-600 space-y-1"></ul>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="submit" class="bg-teal-600 text-white px-6 py-2 rounded hover:bg-teal-700">Finalizar Consulta</button>
                    </div>
                </form>
            </div>

            <!-- Iniciar Nuevo Tratamiento -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Iniciar Nuevo Tratamiento</h2>
                <form id="tratamientoForm" class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-sm text-gray-700">Paciente (ID)</label>
                        <input type="number" id="idPacienteTrat" class="w-full p-2 border rounded" placeholder="ID Paciente" required>
                    </div>
                    <div class="flex-[2]">
                        <label class="block text-sm text-gray-700">Nombre del Tratamiento</label>
                        <input type="text" id="nombreTrat" class="w-full p-2 border rounded" placeholder="Ej: Ortodoncia" required>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Iniciar</button>
                </form>
            </div>

            <!-- Tratamientos Activos -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-green-700 mb-4 border-b pb-2">Tratamientos Activos</h2>
                <div id="tratamientosActivosList" class="space-y-3">
                    <p class="text-gray-500 text-sm">Cargando...</p>
                </div>
            </div>

            <!-- Historial (Tabs o Bloques) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Historial Tratamientos -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-lg font-bold text-gray-600 mb-4 border-b pb-2">Historial Tratamientos</h2>
                    <div id="tratamientosHistorialList" class="space-y-2 max-h-60 overflow-y-auto">
                        <p class="text-gray-500 text-sm">Cargando...</p>
                    </div>
                </div>

                <!-- Historial Citas -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-lg font-bold text-gray-600 mb-4 border-b pb-2">Historial Citas</h2>
                    <div id="citasHistorialList" class="space-y-2 max-h-60 overflow-y-auto">
                        <p class="text-gray-500 text-sm">Cargando...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="src/js/dashboard_medico.js"></script>

</body>
</html>
